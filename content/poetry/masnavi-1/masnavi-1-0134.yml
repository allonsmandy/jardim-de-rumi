id: masnavi-1-0134
category: masnavi-1
number: 134
sectionTitle:
  fa: در بیان آنک عاشق دنیا بر مثال عاشق دیواریست کی بر او تاب آفتاب زند و جهد و جهاد نکرد تا فهم کند کی آن تاب و رونق از دیوار نیست از قرص آفتابست در آسمان چهارم لاجرم کلی دل بر دیوار نهاد چون پرتو آفتاب به آفتاب پیوست او محروم ماند ابدا و حیل بینهم و بین ما یشتهون
firstLine:
  fa: عاشقان کل نه عشاق جزو
originalLanguage: fa
original:
  language: fa
  stanzas:
    - - عاشقان کل نه عشاق جزو
      - ماند از کل آنک شد مشتاق جزو
    - - چونک جزوی عاشق جزوی شود
      - زود معشوقش بکل خود رود
    - - ریش گاو و بندهٔ غیر آمد او
      - غرقه شد کف در ضعیفی در زد او
    - - نیست حاکم تا کند تیمار او
      - کار خواجهٔ خود کند یا کار او
